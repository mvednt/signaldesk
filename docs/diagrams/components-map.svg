<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .num{font-weight:800;font-size:20px;fill:#fff}
      .title{font-weight:700;font-size:17px;fill:#0f172a}
      .role{font-size:12.5px;fill:#475569}
      .tech{font-size:11px;fill:#64748b;font-style:italic}
      .h{font-weight:800;font-size:26px;fill:#0f172a}
      .sub{font-size:14px;fill:#64748b}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
  <text x="30" y="46" class="h">Components Map — from external account signals to timely outreach</text>
  <text x="30" y="72" class="sub">Six components identify and explain which accounts deserve attention this week.</text>

  <!-- ROW 1 -->
  <!-- 1 Trigger -->
  <g>
    <rect x="30" y="110" width="360" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="68" cy="148" r="18" fill="#0ea5e9"/><text x="68" y="155" text-anchor="middle" class="num">1</text>
    <text x="98" y="153" class="title">Trigger</text>
    <text x="52" y="188" class="role">Scheduled scans (daily), manual refresh,</text>
    <text x="52" y="207" class="role">and the Mon/Thu Hot List schedule.</text>
    <text x="52" y="246" class="tech">Vercel Cron · /api/ingest · /api/cron/*</text>
  </g>
  <!-- 2 Input -->
  <g>
    <rect x="420" y="110" width="360" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="458" cy="148" r="18" fill="#0ea5e9"/><text x="458" y="155" text-anchor="middle" class="num">2</text>
    <text x="488" y="153" class="title">Input</text>
    <text x="442" y="188" class="role">Account watchlist + external news / press /</text>
    <text x="442" y="207" class="role">RSS, with publish dates and source URLs.</text>
    <text x="442" y="246" class="tech">Supabase · Google News RSS · NewsAPI</text>
  </g>
  <!-- 3 Context -->
  <g>
    <rect x="810" y="110" width="360" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="848" cy="148" r="18" fill="#0ea5e9"/><text x="848" y="155" text-anchor="middle" class="num">3</text>
    <text x="878" y="153" class="title">Context</text>
    <text x="832" y="183" class="role">Company identities &amp; aliases, workforce-SaaS</text>
    <text x="832" y="201" class="role">relevance, signal taxonomy, matching rules,</text>
    <text x="832" y="219" class="role">and the protected human-CRM boundary.</text>
    <text x="832" y="252" class="tech">accounts · aliases · match threshold</text>
  </g>

  <!-- ROW 2 -->
  <!-- 4 Processing -->
  <g>
    <rect x="810" y="380" width="360" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="848" cy="418" r="18" fill="#0ea5e9"/><text x="848" y="425" text-anchor="middle" class="num">4</text>
    <text x="878" y="423" class="title">Processing</text>
    <text x="832" y="458" class="role">Normalize, deduplicate (content hash),</text>
    <text x="832" y="477" class="role">entity-match, verify dates, recency windows.</text>
    <text x="832" y="516" class="tech">deterministic — no LLM</text>
  </g>
  <!-- 5 AI -->
  <g>
    <rect x="420" y="380" width="360" height="160" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="458" cy="418" r="18" fill="#6366f1"/><text x="458" y="425" text-anchor="middle" class="num">5</text>
    <text x="488" y="423" class="title">AI — Gemini Flash</text>
    <text x="442" y="458" class="role">Classifies the signal, explains why it matters,</text>
    <text x="442" y="477" class="role">drafts a summary and an outreach angle.</text>
    <text x="442" y="516" class="tech">gemini-3.8-flash · structured JSON · validated</text>
  </g>
  <!-- 6 Output -->
  <g>
    <rect x="30" y="380" width="360" height="160" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="68" cy="418" r="18" fill="#10b981"/><text x="68" y="425" text-anchor="middle" class="num">6</text>
    <text x="98" y="423" class="title">Output</text>
    <text x="52" y="453" class="role">Signal records, account ranking, dashboard,</text>
    <text x="52" y="471" class="role">and the Mon/Thu Hot List email.</text>
    <text x="52" y="500" class="role" fill="#047857" font-weight="600">Human CRM fields are never touched.</text>
    <text x="52" y="524" class="tech">dashboard · /hotlist · Resend email</text>
  </g>

  <!-- arrows -->
  <line x1="390" y1="190" x2="418" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="190" x2="808" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="270" x2="990" y2="378" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="460" x2="782" y2="460" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="460" x2="392" y2="460" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Nine Checks boundary footer -->
  <rect x="30" y="592" width="1140" height="78" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="50" y="624" font-weight="700" font-size="13" fill="#7c3aed">Boundary enforced by the Nine Checks</text>
  <text x="50" y="648" font-size="12.5" fill="#6b21a8">Gemini and all scheduled jobs write signal-derived data only. Arjun's contact notes, last-contact dates, and relationship commentary stay unchanged —</text>
  <text x="50" y="666" font-size="12.5" fill="#6b21a8">enforced at the database layer by a restricted `signal_writer` role with no privileges on the human-owned tables (proven, not promised).</text>
</svg>
